<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel-Labyrinth</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Labyrinth">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1d272b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: derselbe Handheld – LCD mit Kartenausschnitt oben, Steuerkreuz unten */
:root {
  --case: #1d272b;
  --case-hi: #2b393e;
  --lcd: #b4c597;
  --lcd-edge: #9fb280;
  --fog: #9caf80;
  --pixel: #22301a;
  --ghost: rgba(34, 48, 26, 0.07);
  --memory: rgba(34, 48, 26, 0.38);
  --key: #36464c;
  --key-press: #4a5d64;
  --key-fg: #dbe5cf;
  --muted: #8fa0a3;
  --display: "Silkscreen", ui-monospace, Menlo, monospace;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--case);
  color: var(--key-fg);
  font-family: var(--mono);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}
[hidden] { display: none !important; }
.app {
  height: 100%;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding-top: max(12px, env(safe-area-inset-top, 0px));
  padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.lcd {
  width: min(100%, 440px);
  box-sizing: border-box;
  background: var(--lcd);
  color: var(--pixel);
  border-radius: 10px;
  padding: 10px;
  box-shadow: inset 0 0 0 3px var(--lcd-edge), 0 0 0 6px var(--case-hi);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hud {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: baseline;
  font-family: var(--display);
  font-size: 13px;
  letter-spacing: 0.05em;
  font-variant-numeric: tabular-nums;
}
.hud > :nth-child(2) { text-align: center; }
.hud > :last-child { text-align: right; }
.board {
  position: relative;
  width: min(100%, calc(100svh - 370px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)));
  min-width: 200px;
  max-width: 100%;
  aspect-ratio: 1;
  align-self: center;
}
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 12px;
  text-align: center;
  background: rgba(180, 197, 151, 0.9);
}
.overlay h1 {
  margin: 0;
  font-family: var(--display);
  font-size: clamp(22px, 7vw, 32px);
  font-weight: 700;
  letter-spacing: 0.06em;
  text-wrap: balance;
}
.overlay p { margin: 0; font-size: 13px; line-height: 1.45; max-width: 30ch; }
.start {
  font-family: var(--display);
  font-size: 16px;
  letter-spacing: 0.05em;
  background: var(--pixel);
  color: var(--lcd);
  border: 0;
  border-radius: 6px;
  padding: 10px 20px;
  cursor: pointer;
}
.log {
  min-height: 1.5em;
  font-size: 12px;
  line-height: 1.5;
  text-align: center;
}
.pad {
  display: grid;
  grid-template-columns: repeat(3, 64px);
  grid-template-rows: repeat(3, 64px);
  gap: 6px;
  flex: none;
}
.key {
  border: 0;
  border-radius: 14px;
  background: var(--key);
  color: var(--key-fg);
  font-family: var(--display);
  font-size: 20px;
  cursor: pointer;
  touch-action: none;
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
}
.key:active, .key.on { background: var(--key-press); transform: translateY(2px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35); }
.key.mid { font-size: 11px; letter-spacing: 0.05em; border-radius: 50%; touch-action: manipulation; }
.key.mid[aria-pressed="true"] { background: var(--lcd); color: var(--pixel); }
.up { grid-area: 1 / 2; } .left { grid-area: 2 / 1; } .mid { grid-area: 2 / 2; }
.right { grid-area: 2 / 3; } .down { grid-area: 3 / 2; }
.foot { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 18px; flex: none; }
.foot a, .foot button {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--muted);
  background: none;
  border: 0;
  padding: 4px 0;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.start:focus-visible, .key:focus-visible, .foot a:focus-visible, .foot button:focus-visible { outline: 3px solid var(--key-fg); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .key:active, .key.on { transform: none; } }
</style>
</head>
<body>
<div class="app">
  <div class="lcd">
    <div class="hud">
      <span>Ebene <b id="depth">1</b></span>
      <span>Züge <b id="turns">0</b></span>
      <span>Münzen <b id="coins">0</b></span>
    </div>
    <div class="board">
      <canvas id="cv" aria-label="Labyrinth"></canvas>
      <div class="overlay" id="overlay" hidden>
        <h1 id="ov-title">Ebene 2</h1>
        <p id="ov-text"></p>
        <button class="start" id="ov-btn" type="button">Weiter</button>
      </div>
    </div>
    <div class="log" id="log" aria-live="polite">Finde die Treppe nach unten.</div>
  </div>
  <div class="pad" aria-label="Steuerung">
    <button class="key up" data-dir="0,-1" type="button" aria-label="Hoch">▲</button>
    <button class="key left" data-dir="-1,0" type="button" aria-label="Links">◀</button>
    <button class="key mid" id="map" type="button" aria-pressed="false">Karte</button>
    <button class="key right" data-dir="1,0" type="button" aria-label="Rechts">▶</button>
    <button class="key down" data-dir="0,1" type="button" aria-label="Runter">▼</button>
  </div>
  <div class="foot">
    <a href="../">Schlange</a>
    <a href="../tictactoe/">Tic-Tac-Toe</a>
    <button id="restart" type="button">Neu beginnen</button>
  </div>
</div>

<script>
(() => {
  const SAVE_KEY = "pixel-labyrinth-run", BEST_KEY = "pixel-labyrinth-best";
  const VIEW = 11;       // sichtbarer Ausschnitt in Feldern
  const SIGHT = 4;       // Sichtweite in Feldern
  const WALL = 1, FLOOR = 0;
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  const $ = id => document.getElementById(id);
  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const rand = n => Math.floor(Math.random() * n);

  // Spielstand eines Durchgangs
  let run = null, showMap = false, busy = false, best = 0;
  let visible = new Set();

  try { best = Number(localStorage.getItem(BEST_KEY)) || 0; } catch (e) {}

  // ---------- Labyrinth erzeugen ----------
  function sizeFor(depth) { return Math.min(13 + 4 * (depth - 1), 41); }

  function generate(depth) {
    const W = sizeFor(depth), H = W;
    const grid = Array.from({ length: H }, () => Array(W).fill(WALL));
    // Tiefensuche über die ungeraden Felder (recursive backtracker, iterativ)
    const stack = [[1, 1]];
    grid[1][1] = FLOOR;
    while (stack.length) {
      const [x, y] = stack[stack.length - 1];
      const options = [[2, 0], [-2, 0], [0, 2], [0, -2]]
        .map(([dx, dy]) => [x + dx, y + dy, x + dx / 2, y + dy / 2])
        .filter(([nx, ny]) => nx > 0 && ny > 0 && nx < W - 1 && ny < H - 1 && grid[ny][nx] === WALL);
      if (!options.length) { stack.pop(); continue; }
      const [nx, ny, mx, my] = options[rand(options.length)];
      grid[my][mx] = FLOOR;
      grid[ny][nx] = FLOOR;
      stack.push([nx, ny]);
    }
    // Ein paar Wände öffnen, damit es Rundwege gibt
    for (let y = 1; y < H - 1; y++)
      for (let x = 1; x < W - 1; x++) {
        if (grid[y][x] !== WALL || Math.random() > 0.07) continue;
        const horiz = grid[y][x - 1] === FLOOR && grid[y][x + 1] === FLOOR && grid[y - 1][x] === WALL && grid[y + 1][x] === WALL;
        const vert = grid[y - 1][x] === FLOOR && grid[y + 1][x] === FLOOR && grid[y][x - 1] === WALL && grid[y][x + 1] === WALL;
        if (horiz || vert) grid[y][x] = FLOOR;
      }
    // Treppe auf das am weitesten entfernte Feld
    const dist = bfs(grid, 1, 1);
    let exit = [1, 1], far = 0;
    dist.forEach((d, k) => { if (d > far) { far = d; exit = [k % W, Math.floor(k / W)]; } });
    // Münzen auf zufällige freie Felder
    const free = [];
    for (let y = 0; y < H; y++)
      for (let x = 0; x < W; x++)
        if (grid[y][x] === FLOOR && !(x === 1 && y === 1) && !(x === exit[0] && y === exit[1])) free.push([x, y]);
    const coins = [];
    for (let i = 0; i < 2 + depth && free.length; i++) coins.push(free.splice(rand(free.length), 1)[0]);
    return { W, H, grid, exit, coins, seen: Array(W * H).fill(0), player: [1, 1] };
  }

  function bfs(grid, sx, sy) {
    const W = grid[0].length, H = grid.length, dist = new Map([[sy * W + sx, 0]]), q = [[sx, sy]];
    while (q.length) {
      const [x, y] = q.shift(), d = dist.get(y * W + x);
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + dx, ny = y + dy, k = ny * W + nx;
        if (nx < 0 || ny < 0 || nx >= W || ny >= H || grid[ny][nx] === WALL || dist.has(k)) continue;
        dist.set(k, d + 1);
        q.push([nx, ny]);
      }
    }
    return dist;
  }

  // ---------- Sicht ----------
  function lineClear(x0, y0, x1, y1) {
    const g = run.level.grid;
    let dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, err = dx + dy;
    while (true) {
      if (x0 === x1 && y0 === y1) return true;
      if (g[y0][x0] === WALL && !(x0 === run.level.player[0] && y0 === run.level.player[1])) return false;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  }

  function updateSight() {
    const L = run.level, [px, py] = L.player;
    visible = new Set();
    for (let y = py - SIGHT; y <= py + SIGHT; y++)
      for (let x = px - SIGHT; x <= px + SIGHT; x++) {
        if (x < 0 || y < 0 || x >= L.W || y >= L.H) continue;
        if ((x - px) ** 2 + (y - py) ** 2 > SIGHT * SIGHT + 1) continue;
        if (!lineClear(px, py, x, y)) continue;
        visible.add(y * L.W + x);
        L.seen[y * L.W + x] = 1;
      }
  }

  // ---------- Züge ----------
  function newRun() {
    run = { depth: 1, turns: 0, coins: 0, level: generate(1) };
    startLevel("Finde die Treppe nach unten.");
  }

  function startLevel(msg) {
    showMap = false;
    updateSight();
    log(msg);
    save();
    render();
  }

  function tryMove(dx, dy) {
    if (busy || !run) return;
    if (showMap) { showMap = false; }
    const L = run.level, nx = L.player[0] + dx, ny = L.player[1] + dy;
    if (L.grid[ny]?.[nx] !== FLOOR) { bump(); return; }
    L.player = [nx, ny];
    run.turns++;
    const ci = L.coins.findIndex(([x, y]) => x === nx && y === ny);
    if (ci >= 0) {
      L.coins.splice(ci, 1);
      run.coins++;
      log(L.coins.length ? `Münze gefunden! Noch ${L.coins.length} auf dieser Ebene.` : "Alle Münzen dieser Ebene gefunden!");
    }
    endTurn();
    if (nx === L.exit[0] && ny === L.exit[1]) descend();
  }

  // Hier kommen später die Gegner dran: jeder Zug des Spielers gibt ihnen einen Zug.
  function endTurn() {
    updateSight();
    save();
    render();
  }

  function descend() {
    const left = run.level.coins.length;
    run.depth++;
    if (run.depth > best) {
      best = run.depth;
      try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
    }
    run.level = generate(run.depth);
    save();
    busy = true;
    $("ov-title").textContent = `Ebene ${run.depth}`;
    $("ov-text").textContent = `${run.turns} Züge bisher, ${run.coins} ${run.coins === 1 ? "Münze" : "Münzen"}.${left ? ` ${left} ${left === 1 ? "Münze blieb" : "Münzen blieben"} oben liegen.` : ""} Das Labyrinth wird größer.`;
    $("ov-btn").textContent = "Hinabsteigen";
    $("overlay").hidden = false;
  }

  $("ov-btn").addEventListener("click", () => {
    $("overlay").hidden = true;
    busy = false;
    startLevel(`Ebene ${run.depth}. Rekord: Ebene ${best}.`);
  });

  let bumpTimer = null;
  function bump() {
    log("Eine Wand.");
    clearTimeout(bumpTimer);
    bumpTimer = setTimeout(() => log(""), 900);
  }

  function log(text) { $("log").textContent = text; }

  function save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(run)); } catch (e) {}
  }

  function load() {
    try {
      const r = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
      if (r && r.level && r.level.grid && r.level.player) return r;
    } catch (e) {}
    return null;
  }

  // ---------- Zeichnen ----------
  function resize() {
    const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(r.width * dpr);
    cv.height = Math.round(r.height * dpr);
    render();
  }

  // Kleine Pixelbilder, 7×7
  const SPRITES = {
    player: ["..###..", "..###..", "...#...", ".#####.", "#.###.#", "..#.#..", ".##.##."],
    stairs: ["#######", "#.....#", "#####.#", "#...#.#", "###.#.#", "#.#.#.#", "#######"],
    coin:   [".......", "...#...", "..###..", ".##.##.", "..###..", "...#...", "......."],
  };

  function sprite(name, x, y, s, color) {
    const rows = SPRITES[name], u = s / 9;
    ctx.fillStyle = color;
    rows.forEach((row, j) => [...row].forEach((ch, i) => {
      if (ch === "#") ctx.fillRect(Math.round(x + (i + 1) * u), Math.round(y + (j + 1) * u), Math.ceil(u), Math.ceil(u));
    }));
  }

  function render() {
    $("depth").textContent = run.depth;
    $("turns").textContent = run.turns;
    $("coins").textContent = run.coins;
    $("map").setAttribute("aria-pressed", String(showMap));
    $("map").textContent = showMap ? "Zurück" : "Karte";

    const L = run.level, colors = {
      lcd: css("--lcd"), fog: css("--fog"), pixel: css("--pixel"), ghost: css("--ghost"), memory: css("--memory"),
    };
    ctx.fillStyle = colors.fog;
    ctx.fillRect(0, 0, cv.width, cv.height);

    // Ausschnitt: um den Spieler zentriert, oder die ganze Karte
    let n, ox, oy;
    if (showMap) { n = L.W; ox = 0; oy = 0; }
    else { n = VIEW; ox = L.player[0] - (VIEW - 1) / 2; oy = L.player[1] - (VIEW - 1) / 2; }
    const s = cv.width / n;

    for (let j = 0; j < n; j++)
      for (let i = 0; i < n; i++) {
        const x = ox + i, y = oy + j;
        if (x < 0 || y < 0 || x >= L.W || y >= L.H) continue;
        const k = y * L.W + x, vis = visible.has(k), seen = L.seen[k];
        const px = Math.floor(i * s), py = Math.floor(j * s), w = Math.ceil(s);
        if (!vis && !seen) {
          // Unerkundet: Nebel mit einem Pixelpunkt pro Feld
          const d = Math.max(2, Math.round(s / 9));
          ctx.fillStyle = colors.memory;
          ctx.fillRect(Math.round(px + s / 2 - d / 2), Math.round(py + s / 2 - d / 2), d, d);
          continue;
        }
        if (L.grid[y][x] === WALL) {
          ctx.fillStyle = vis ? colors.pixel : colors.memory;
          ctx.fillRect(px, py, w, w);
        } else {
          ctx.fillStyle = colors.lcd;
          ctx.fillRect(px, py, w, w);
          if (!vis) { ctx.fillStyle = colors.ghost; ctx.fillRect(px, py, w, w); }
        }
      }

    const at = (x, y) => [Math.floor((x - ox) * s), Math.floor((y - oy) * s)];
    const show = (x, y) => visible.has(y * L.W + x) || L.seen[y * L.W + x];
    if (show(...L.exit)) sprite("stairs", ...at(...L.exit), s, visible.has(L.exit[1] * L.W + L.exit[0]) ? colors.pixel : colors.memory);
    L.coins.forEach(([x, y]) => { if (visible.has(y * L.W + x)) sprite("coin", ...at(x, y), s, colors.pixel); });
    sprite("player", ...at(...L.player), s, colors.pixel);

    ctx.strokeStyle = colors.pixel;
    ctx.lineWidth = Math.max(2, cv.width * 0.006);
    ctx.strokeRect(ctx.lineWidth / 2, ctx.lineWidth / 2, cv.width - ctx.lineWidth, cv.height - ctx.lineWidth);
  }

  // ---------- Steuerung ----------
  // Steuerkreuz: Gedrückt halten läuft weiter, ein Schritt pro Zug
  document.querySelectorAll(".key[data-dir]").forEach(btn => {
    const [dx, dy] = btn.dataset.dir.split(",").map(Number);
    let repeat = null;
    const stop = () => { clearTimeout(repeat); clearInterval(repeat); repeat = null; btn.classList.remove("on"); };
    btn.addEventListener("pointerdown", e => {
      e.preventDefault();
      btn.setPointerCapture?.(e.pointerId);
      btn.classList.add("on");
      tryMove(dx, dy);
      repeat = setTimeout(() => { repeat = setInterval(() => tryMove(dx, dy), 110); }, 280);
    });
    ["pointerup", "pointercancel", "lostpointercapture"].forEach(ev => btn.addEventListener(ev, stop));
    btn.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tryMove(dx, dy); } });
  });

  $("map").addEventListener("click", () => { if (busy) return; showMap = !showMap; render(); });

  // Wischen: ein Schritt pro Wischbewegung
  let sx = null, sy = null;
  cv.addEventListener("pointerdown", e => { sx = e.clientX; sy = e.clientY; });
  cv.addEventListener("pointermove", e => {
    if (sx === null) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 26) return;
    Math.abs(dx) > Math.abs(dy) ? tryMove(Math.sign(dx), 0) : tryMove(0, Math.sign(dy));
    sx = e.clientX; sy = e.clientY;
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach(ev => cv.addEventListener(ev, () => { sx = sy = null; }));

  document.addEventListener("keydown", e => {
    const map = { ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1], ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0] };
    if (map[e.key]) { e.preventDefault(); tryMove(...map[e.key]); }
    else if (e.key === "m") { showMap = !showMap; render(); }
  });

  // Neu beginnen mit Bestätigung durch zweites Tippen
  let confirmTimer = null;
  $("restart").addEventListener("click", () => {
    if (!confirmTimer) {
      $("restart").textContent = "Wirklich? Nochmal tippen";
      confirmTimer = setTimeout(() => { $("restart").textContent = "Neu beginnen"; confirmTimer = null; }, 2500);
      return;
    }
    clearTimeout(confirmTimer);
    confirmTimer = null;
    $("restart").textContent = "Neu beginnen";
    $("overlay").hidden = true;
    busy = false;
    newRun();
  });

  window.addEventListener("resize", resize);

  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }

  run = load();
  if (run) {
    updateSight();
    log(`Weiter auf Ebene ${run.depth}.`);
    render();
  } else {
    newRun();
  }
  resize();
})();
</script>
</body>
</html>
