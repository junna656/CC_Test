<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel-Tic-Tac-Toe</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tic-Tac-Toe">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1d272b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: derselbe Handheld wie bei der Schlange – LCD mit Spielfeld oben, Einstellungen unten */
:root {
  --case: #1d272b;
  --case-hi: #2b393e;
  --lcd: #b4c597;
  --lcd-edge: #9fb280;
  --pixel: #22301a;
  --ghost: rgba(34, 48, 26, 0.12);
  --key: #36464c;
  --key-press: #4a5d64;
  --key-fg: #dbe5cf;
  --muted: #8fa0a3;
  --display: "Silkscreen", ui-monospace, Menlo, monospace;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--case);
  color: var(--key-fg);
  font-family: var(--mono);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}
[hidden] { display: none !important; }
.app {
  height: 100%;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding-top: max(12px, env(safe-area-inset-top, 0px));
  padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.lcd {
  width: min(100%, 440px);
  box-sizing: border-box;
  background: var(--lcd);
  color: var(--pixel);
  border-radius: 10px;
  padding: 10px;
  box-shadow: inset 0 0 0 3px var(--lcd-edge), 0 0 0 6px var(--case-hi);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.hud {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: baseline;
  font-family: var(--display);
  font-size: 13px;
  letter-spacing: 0.05em;
  font-variant-numeric: tabular-nums;
}
.hud > :nth-child(2) { text-align: center; opacity: 0.7; }
.hud > :last-child { text-align: right; }
.board {
  width: min(100%, calc(100svh - 400px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)));
  min-width: 200px;
  max-width: 100%;
  aspect-ratio: 1;
  align-self: center;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: 6px;
  background: var(--pixel);
  border: 6px solid var(--pixel);
  box-sizing: border-box;
}
.cell {
  border: 0;
  padding: 0;
  margin: 0;
  background: var(--lcd);
  color: var(--pixel);
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(40px, 15vw, 76px);
  line-height: 1;
  cursor: pointer;
  touch-action: manipulation;
  display: grid;
  place-items: center;
  background-image:
    linear-gradient(var(--ghost) 1px, transparent 1px),
    linear-gradient(90deg, var(--ghost) 1px, transparent 1px);
  background-size: 8px 8px;
}
.cell:disabled { cursor: default; }
.cell.win { background-color: var(--pixel); color: var(--lcd); background-image: none; }
.cell .mark { display: block; transform: scale(0.4); opacity: 0; transition: transform 140ms steps(3), opacity 140ms steps(3); }
.cell .mark.in { transform: none; opacity: 1; }
.cell:focus-visible { outline: 4px solid var(--case); outline-offset: -8px; }
.status {
  min-height: 2.6em;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-family: var(--display);
  font-size: 14px;
  letter-spacing: 0.04em;
}
.next {
  font-family: var(--display);
  font-size: 13px;
  letter-spacing: 0.05em;
  background: var(--pixel);
  color: var(--lcd);
  border: 0;
  border-radius: 6px;
  padding: 9px 14px;
  cursor: pointer;
  flex: none;
}
.controls { width: min(100%, 440px); display: flex; flex-direction: column; gap: 10px; flex: none; }
.seg {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 4px;
  padding: 4px;
  background: var(--case-hi);
  border-radius: 12px;
  border: 0;
  margin: 0;
}
.seg legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.seg button {
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: var(--key-fg);
  font-family: var(--display);
  font-size: 12px;
  letter-spacing: 0.05em;
  padding: 11px 6px;
  cursor: pointer;
  touch-action: manipulation;
}
.seg button[aria-pressed="true"] { background: var(--lcd); color: var(--pixel); }
.seg button:focus-visible, .next:focus-visible, .reset:focus-visible, .back:focus-visible { outline: 3px solid var(--key-fg); outline-offset: 2px; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.reset, .back {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--muted);
  background: none;
  border: 0;
  padding: 6px 0;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 3px;
}
@media (prefers-reduced-motion: reduce) { .cell .mark { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <div class="lcd">
    <div class="hud" aria-live="polite">
      <span id="name-x">Du</span>
      <span>Remis <b id="s-draw">0</b></span>
      <span id="name-o">Handy</span>
    </div>
    <div class="board" id="board" role="grid" aria-label="Spielfeld"></div>
    <div class="status">
      <span id="status" aria-live="polite">Du bist dran</span>
      <button class="next" id="next" type="button" hidden>Nächste Runde</button>
    </div>
  </div>

  <div class="controls">
    <fieldset class="seg" id="mode">
      <legend>Gegner</legend>
      <button type="button" data-mode="cpu" aria-pressed="true">Gegen Handy</button>
      <button type="button" data-mode="duo" aria-pressed="false">Zu zweit</button>
    </fieldset>
    <fieldset class="seg" id="level">
      <legend>Schwierigkeit</legend>
      <button type="button" data-level="leicht" aria-pressed="false">Leicht</button>
      <button type="button" data-level="mittel" aria-pressed="true">Mittel</button>
      <button type="button" data-level="profi" aria-pressed="false">Profi</button>
    </fieldset>
    <div class="foot">
      <a class="back" href="../">← Zur Schlange</a>
      <button class="reset" id="reset" type="button">Punkte zurücksetzen</button>
    </div>
  </div>
</div>

<script>
(() => {
  const SAVE_KEY = "pixel-ttt";
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const $ = id => document.getElementById(id);
  const other = p => (p === "X" ? "O" : "X");

  let mode = "cpu", level = "mittel";
  let score = { X: 0, O: 0, draw: 0 };
  let board, turn, starter = "O", over = false, thinking = null;

  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY) || "{}");
    if (s.mode === "cpu" || s.mode === "duo") mode = s.mode;
    if (["leicht", "mittel", "profi"].includes(s.level)) level = s.level;
    if (s.score) score = { X: +s.score.X || 0, O: +s.score.O || 0, draw: +s.score.draw || 0 };
  } catch (e) {}

  function save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify({ mode, level, score })); } catch (e) {}
  }

  // Spielfeld aufbauen
  const cells = [];
  for (let i = 0; i < 9; i++) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "cell";
    b.setAttribute("role", "gridcell");
    b.addEventListener("click", () => onCell(i));
    $("board").appendChild(b);
    cells.push(b);
  }

  // Spiellogik
  function result(b) {
    for (const line of LINES) {
      const [a, c, d] = line;
      if (b[a] && b[a] === b[c] && b[a] === b[d]) return { winner: b[a], line };
    }
    return b.every(Boolean) ? { winner: null, line: [] } : null;
  }

  function empties(b) { return b.map((v, i) => (v ? -1 : i)).filter(i => i >= 0); }
  function pick(list) { return list[Math.floor(Math.random() * list.length)]; }

  // Minimax: +10 für eigenen Sieg, schneller Sieg zählt mehr
  function minimax(b, toMove, me, depth) {
    const r = result(b);
    if (r) return r.winner === me ? 10 - depth : r.winner ? depth - 10 : 0;
    let best = toMove === me ? -Infinity : Infinity;
    for (const i of empties(b)) {
      b[i] = toMove;
      const s = minimax(b, other(toMove), me, depth + 1);
      b[i] = null;
      best = toMove === me ? Math.max(best, s) : Math.min(best, s);
    }
    return best;
  }

  function bestMove(b, me) {
    let best = -Infinity, moves = [];
    for (const i of empties(b)) {
      b[i] = me;
      const s = minimax(b, other(me), me, 1);
      b[i] = null;
      if (s > best) { best = s; moves = [i]; } else if (s === best) moves.push(i);
    }
    return pick(moves);
  }

  function finishingMove(b, p) {
    for (const i of empties(b)) {
      b[i] = p;
      const won = result(b)?.winner === p;
      b[i] = null;
      if (won) return i;
    }
    return null;
  }

  function cpuMove(b, me) {
    if (level === "profi") return bestMove(b, me);
    if (level === "mittel") {
      const win = finishingMove(b, me);
      if (win !== null) return win;
      const block = finishingMove(b, other(me));
      if (block !== null) return block;
      if (!b[4] && Math.random() < 0.6) return 4;
    }
    return pick(empties(b));
  }

  // Ablauf
  function newRound() {
    clearTimeout(thinking);
    thinking = null;
    board = Array(9).fill(null);
    starter = other(starter);
    turn = starter;
    over = false;
    $("next").hidden = true;
    cells.forEach(c => { c.textContent = ""; c.classList.remove("win"); });
    render();
    maybeCpu();
  }

  function onCell(i) {
    if (over) return newRound();
    if (board[i] || thinking || (mode === "cpu" && turn === "O")) return;
    play(i);
    maybeCpu();
  }

  function play(i) {
    board[i] = turn;
    const mark = document.createElement("span");
    mark.className = "mark";
    mark.textContent = turn;
    cells[i].appendChild(mark);
    requestAnimationFrame(() => requestAnimationFrame(() => mark.classList.add("in")));
    const r = result(board);
    if (r) {
      over = true;
      r.line.forEach(k => cells[k].classList.add("win"));
      score[r.winner || "draw"]++;
      save();
      $("next").hidden = false;
    } else {
      turn = other(turn);
    }
    render(r);
  }

  function maybeCpu() {
    if (mode !== "cpu" || over || turn !== "O") return;
    thinking = setTimeout(() => {
      thinking = null;
      play(cpuMove(board, "O"));
    }, 450 + Math.random() * 300);
    render();
  }

  function label(p) {
    if (mode === "duo") return p;
    return p === "X" ? "Du" : "Handy";
  }

  function render(r) {
    $("name-x").innerHTML = "";
    $("name-o").innerHTML = "";
    $("name-x").append(`${label("X")}${mode === "duo" ? "" : " (X)"} `, Object.assign(document.createElement("b"), { textContent: score.X }));
    $("name-o").append(Object.assign(document.createElement("b"), { textContent: score.O }), ` ${label("O")}${mode === "duo" ? "" : " (O)"}`);
    $("s-draw").textContent = score.draw;

    let text;
    if (r && r.winner) {
      text = mode === "duo" ? `${r.winner} gewinnt!` : r.winner === "X" ? "Du gewinnst!" : "Handy gewinnt";
    } else if (r) {
      text = "Unentschieden";
    } else if (mode === "cpu") {
      text = turn === "X" ? "Du bist dran" : "Handy denkt …";
    } else {
      text = `${turn} ist dran`;
    }
    $("status").textContent = text;

    const locked = over || thinking || (mode === "cpu" && turn === "O");
    cells.forEach((c, i) => {
      c.disabled = !over && (!!board[i] || !!locked);
      c.setAttribute("aria-label", `Feld ${i + 1}: ${board[i] || "leer"}`);
    });

    document.querySelectorAll("#mode button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));
    document.querySelectorAll("#level button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.level === level)));
    $("level").hidden = mode !== "cpu";
  }

  // Einstellungen: ein Wechsel startet neu, die Punkte gelten pro Spielart
  $("mode").addEventListener("click", e => {
    const m = e.target.closest("button")?.dataset.mode;
    if (!m || m === mode) return;
    mode = m;
    score = { X: 0, O: 0, draw: 0 };
    starter = "O";
    save();
    newRound();
  });
  $("level").addEventListener("click", e => {
    const l = e.target.closest("button")?.dataset.level;
    if (!l || l === level) return;
    level = l;
    score = { X: 0, O: 0, draw: 0 };
    starter = "O";
    save();
    newRound();
  });
  $("reset").addEventListener("click", () => {
    score = { X: 0, O: 0, draw: 0 };
    save();
    render(over ? result(board) : null);
  });
  $("next").addEventListener("click", newRound);

  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }

  newRound();
})();
</script>
</body>
</html>
