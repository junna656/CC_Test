<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel-Verlies</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Verlies">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1d272b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: derselbe Handheld – der ganze Raum auf dem LCD, Steuerkreuz unten */
:root {
  --case: #1d272b;
  --case-hi: #2b393e;
  --lcd: #b4c597;
  --lcd-edge: #9fb280;
  --pixel: #22301a;
  --ghost: rgba(34, 48, 26, 0.08);
  --soft: rgba(34, 48, 26, 0.4);
  --mortar: rgba(180, 197, 151, 0.28);
  --key: #36464c;
  --key-press: #4a5d64;
  --key-fg: #dbe5cf;
  --muted: #8fa0a3;
  --display: "Silkscreen", ui-monospace, Menlo, monospace;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--case);
  color: var(--key-fg);
  font-family: var(--mono);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}
[hidden] { display: none !important; }
.app {
  height: 100%;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding-top: max(12px, env(safe-area-inset-top, 0px));
  padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.lcd {
  width: min(100%, 440px);
  box-sizing: border-box;
  background: var(--lcd);
  color: var(--pixel);
  border-radius: 10px;
  padding: 10px;
  box-shadow: inset 0 0 0 3px var(--lcd-edge), 0 0 0 6px var(--case-hi);
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: relative;
}
.hud {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  font-family: var(--display);
  font-size: 13px;
  letter-spacing: 0.05em;
  font-variant-numeric: tabular-nums;
}
.hud > :nth-child(2) { text-align: center; }
.hud > :last-child { text-align: right; }
.hearts { display: inline-flex; gap: 3px; vertical-align: -2px; }
.hearts canvas { width: 14px; height: 14px; image-rendering: pixelated; }
.board {
  position: relative;
  width: min(100%, calc(100svh - 370px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)));
  min-width: 220px;
  max-width: 100%;
  aspect-ratio: 1;
  align-self: center;
}
#cv { display: block; width: 100%; height: 100%; touch-action: none; }
.overlay {
  position: fixed;
  inset: 0;
  z-index: 5;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: safe center;
  gap: 14px;
  overflow-y: auto;
  padding-top: max(20px, env(safe-area-inset-top, 0px));
  padding-bottom: max(20px, env(safe-area-inset-bottom, 0px));
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  text-align: center;
  color: var(--pixel);
  background: var(--lcd);
}
.overlay h1 {
  margin: 0;
  font-family: var(--display);
  font-size: clamp(22px, 7vw, 32px);
  font-weight: 700;
  letter-spacing: 0.06em;
  text-wrap: balance;
}
.overlay p { margin: 0; font-size: 13px; line-height: 1.45; max-width: 30ch; }
.legend { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: center; text-align: left; font-size: 12px; }
.legend canvas { width: 22px; height: 22px; }
.start {
  font-family: var(--display);
  font-size: 16px;
  letter-spacing: 0.05em;
  background: var(--pixel);
  color: var(--lcd);
  border: 0;
  border-radius: 6px;
  padding: 10px 20px;
  cursor: pointer;
}
.log { min-height: 1.5em; font-size: 12px; line-height: 1.5; text-align: center; }
.pad {
  display: grid;
  grid-template-columns: repeat(3, 64px);
  grid-template-rows: repeat(3, 64px);
  gap: 6px;
  flex: none;
}
.key {
  border: 0;
  border-radius: 14px;
  background: var(--key);
  color: var(--key-fg);
  font-family: var(--display);
  font-size: 20px;
  cursor: pointer;
  touch-action: none;
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
}
.key:active, .key.on { background: var(--key-press); transform: translateY(2px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35); }
.key.mid { font-size: 11px; letter-spacing: 0.05em; border-radius: 50%; touch-action: manipulation; }
.up { grid-area: 1 / 2; } .left { grid-area: 2 / 1; } .mid { grid-area: 2 / 2; }
.right { grid-area: 2 / 3; } .down { grid-area: 3 / 2; }
.foot { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 18px; flex: none; }
.foot a, .foot button {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--muted);
  background: none;
  border: 0;
  padding: 4px 0;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.start:focus-visible, .key:focus-visible, .foot a:focus-visible, .foot button:focus-visible { outline: 3px solid var(--key-fg); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .key:active, .key.on { transform: none; } }
</style>
</head>
<body>
<div class="app">
  <div class="lcd">
    <div class="hud">
      <span>Raum <b id="room">1</b></span>
      <span class="hearts" id="hearts" aria-label="Herzen"></span>
      <span>Münzen <b id="coins">0</b></span>
    </div>
    <div class="board">
      <canvas id="cv" aria-label="Raum"></canvas>
    </div>
    <div class="log" id="log" aria-live="polite"></div>
    <div class="overlay" id="overlay" hidden>
      <h1 id="ov-title"></h1>
      <p id="ov-text"></p>
      <div class="legend" id="legend" hidden></div>
      <button class="start" id="ov-btn" type="button"></button>
    </div>
  </div>
  <div class="pad" aria-label="Steuerung">
    <button class="key up" data-dir="0,-1" type="button" aria-label="Hoch">▲</button>
    <button class="key left" data-dir="-1,0" type="button" aria-label="Links">◀</button>
    <button class="key mid" id="wait" type="button">Warten</button>
    <button class="key right" data-dir="1,0" type="button" aria-label="Rechts">▶</button>
    <button class="key down" data-dir="0,1" type="button" aria-label="Runter">▼</button>
  </div>
  <div class="foot">
    <a href="../">Schlange</a>
    <a href="../tictactoe/">Tic-Tac-Toe</a>
    <button id="retry" type="button">Raum neu</button>
    <button id="help" type="button">Hilfe</button>
  </div>
</div>

<script>
(() => {
  const SAVE_KEY = "pixel-verlies-run", BEST_KEY = "pixel-verlies-best";
  const N = 13;                    // Raum inklusive Mauer: 13 × 13 Felder
  const DOOR = [6, 0], ENTRY = [6, 11], MAX_HEARTS = 3;
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  const $ = id => document.getElementById(id);
  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const rand = n => Math.floor(Math.random() * n);
  const same = (a, b) => a[0] === b[0] && a[1] === b[1];

  // ---------- Pixelbilder, 7 × 7 ----------
  const SPRITES = {
    player: ["..###..", "..###..", "...#...", ".#####.", "#.###.#", "..#.#..", ".##.##."],
    pillar: ["#######", ".#####.", ".#.#.#.", ".#.#.#.", ".#.#.#.", ".#####.", "#######"],
    crate:  ["#######", "##...##", "#.#.#.#", "#..#..#", "#.#.#.#", "##...##", "#######"],
    coin:   [".......", "...#...", "..###..", ".##.##.", "..###..", "...#...", "......."],
    gem:    [".#####.", "#.#.#.#", "#######", ".#...#.", "..#.#..", "...#...", "......."],
    key:    [".......", ".##....", "#..#...", "#..####", ".##.#.#", ".......", "......."],
    potion: ["..###..", "...#...", "..#.#..", ".#...#.", "#######", "#######", ".#####."],
    spikesUp:   [".#...#.", ".#...#.", "###.###", "...#...", "...#...", "..###..", "......."],
    spikesDown: [".......", ".......", "#.#.#.#", ".......", ".#.#.#.", ".......", "......."],
    doorShut:   ["#######", "#.....#", "#.....#", "#...#.#", "#.....#", "#.....#", "#.....#"],
    doorOpen:   ["...#...", "..###..", ".#.#.#.", "...#...", "...#...", "...#...", "......."],
    heart:      [".##.##.", "#######", "#######", ".#####.", "..###..", "...#...", "......."],
    heartEmpty: [".##.##.", "#..#..#", "#.....#", ".#...#.", "..#.#..", "...#...", "......."],
  };

  function sprite(c, name, x, y, s, color) {
    const u = s / 9;
    c.fillStyle = color;
    SPRITES[name].forEach((row, j) => [...row].forEach((ch, i) => {
      if (ch === "#") c.fillRect(Math.round(x + (i + 1) * u), Math.round(y + (j + 1) * u), Math.ceil(u), Math.ceil(u));
    }));
  }

  // ---------- Räume erzeugen ----------
  // Ein Raum: Liste von Dingen mit Typ und Position. Mauern ergeben sich aus dem Rand.
  function isWall(x, y) { return x <= 0 || y <= 0 || x >= N - 1 || y >= N - 1; }

  function generateRoom(no, hearts) {
    for (let attempt = 0; attempt < 200; attempt++) {
      const things = [];
      const taken = new Set([ENTRY.join(), "6,1", "6,10", "5,11", "7,11"]);
      const free = () => {
        for (let t = 0; t < 100; t++) {
          const p = [1 + rand(N - 2), 1 + rand(N - 2)];
          if (!taken.has(p.join())) { taken.add(p.join()); return p; }
        }
        return null;
      };
      const add = (type, p, extra = {}) => p && things.push({ type, x: p[0], y: p[1], ...extra });

      // Säulen, teils als 2×2-Block
      const pillars = 3 + rand(3);
      for (let i = 0; i < pillars; i++) {
        const p = free();
        if (!p) continue;
        add("pillar", p);
        if (Math.random() < 0.35) {
          for (const [dx, dy] of [[1, 0], [0, 1], [1, 1]]) {
            const q = [p[0] + dx, p[1] + dy];
            if (!isWall(...q) && !taken.has(q.join())) { taken.add(q.join()); add("pillar", q); }
          }
        }
      }
      // Stacheln ab Raum 2, als Reihen mit wechselndem Takt
      if (no >= 2) {
        const strips = Math.min(1 + Math.floor(no / 2), 4);
        for (let i = 0; i < strips; i++) {
          const horizontal = Math.random() < 0.6, len = 3 + rand(3), phase = rand(2);
          const start = [1 + rand(N - 2 - (horizontal ? len : 0)), 2 + rand(N - 4 - (horizontal ? 0 : len))];
          for (let k = 0; k < len; k++) {
            const q = horizontal ? [start[0] + k, start[1]] : [start[0], start[1] + k];
            if (isWall(...q) || taken.has(q.join())) continue;
            taken.add(q.join());
            add("spikes", q, { phase: (phase + (Math.random() < 0.25 ? 1 : 0)) % 2 });
          }
        }
      }
      const crates = 2 + rand(3) + Math.min(no, 3);
      for (let i = 0; i < crates; i++) add("crate", free());
      const coins = 3 + rand(3);
      for (let i = 0; i < coins; i++) add("coin", free());
      if (Math.random() < 0.35 + no * 0.05) add("gem", free());
      if (hearts < MAX_HEARTS && Math.random() < 0.5) add("potion", free());
      // Schlüssel nicht zu nah am Eingang
      let keyPos = null;
      for (let t = 0; t < 30 && !keyPos; t++) {
        const p = free();
        if (p && Math.abs(p[0] - ENTRY[0]) + Math.abs(p[1] - ENTRY[1]) >= 7) keyPos = p;
      }
      if (!keyPos) continue;
      add("key", keyPos);

      // Prüfen: ohne Kisten zu schieben ist alles Wichtige erreichbar
      const blocked = new Set(things.filter(t => t.type === "pillar" || t.type === "crate").map(t => `${t.x},${t.y}`));
      const reach = new Set([ENTRY.join()]), q = [ENTRY];
      while (q.length) {
        const [x, y] = q.shift();
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const n = [x + dx, y + dy], k = n.join();
          if (isWall(...n) || blocked.has(k) || reach.has(k)) continue;
          reach.add(k);
          q.push(n);
        }
      }
      const needed = things.filter(t => t.type !== "pillar" && t.type !== "crate" && t.type !== "spikes");
      if (!reach.has("6,1") || needed.some(t => !reach.has(`${t.x},${t.y}`))) continue;
      return { no, things, player: [...ENTRY], hasKey: false, tick: 0 };
    }
    return generateRoom(no, hearts);
  }

  // ---------- Spielstand ----------
  let run = null, busy = false, best = 0;
  try { best = Number(localStorage.getItem(BEST_KEY)) || 0; } catch (e) {}

  const clone = o => JSON.parse(JSON.stringify(o));

  function newRun() {
    run = { hearts: MAX_HEARTS, coins: 0, turns: 0, room: generateRoom(1, MAX_HEARTS) };
    run.snapshot = clone({ hearts: run.hearts, coins: run.coins, turns: run.turns, room: run.room });
    log("Hol den Schlüssel, dann öffnet sich die Tür oben.");
    save();
    render();
  }

  function enterRoom(no) {
    run.room = generateRoom(no, run.hearts);
    run.snapshot = clone({ hearts: run.hearts, coins: run.coins, turns: run.turns, room: run.room });
    const hint = no === 2 ? "Stacheln! Sie fahren jede Runde hoch oder runter. Mit „Warten“ passt du den Moment ab." : "Hol den Schlüssel.";
    log(hint);
    save();
    render();
  }

  function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(run)); } catch (e) {} }
  function load() {
    try {
      const r = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
      if (r && r.room && r.room.things && r.snapshot && r.hearts > 0) return r;
    } catch (e) {}
    return null;
  }

  // ---------- Regeln ----------
  const thingAt = (x, y, ...types) => run.room.things.find(t => t.x === x && t.y === y && (!types.length || types.includes(t.type)));
  const spikesUp = t => (run.room.tick + t.phase) % 2 === 0;

  function act(dx, dy) {
    if (busy || !run) return;
    const R = run.room;
    if (dx || dy) {
      const tx = R.player[0] + dx, ty = R.player[1] + dy;
      if (tx === DOOR[0] && ty === DOOR[1]) {
        if (R.hasKey) return nextRoom();
        return log("Die Tür ist verschlossen. Du brauchst den Schlüssel.");
      }
      if (isWall(tx, ty) || thingAt(tx, ty, "pillar")) return log("Da geht es nicht weiter.");
      const crate = thingAt(tx, ty, "crate");
      if (crate) {
        const ux = tx + dx, uy = ty + dy;
        const blockedBehind = isWall(ux, uy) || thingAt(ux, uy) || (ux === 6 && uy === 1) || (ux === DOOR[0] && uy === DOOR[1]);
        if (blockedBehind) return log("Die Kiste lässt sich nicht weiterschieben.");
        crate.x = ux; crate.y = uy;
      }
      R.player = [tx, ty];
      pickUp(tx, ty);
    }
    run.turns++;
    // Stacheln: wer auf ausgefahrenen Stacheln steht, verliert ein Herz. Danach wechseln sie.
    const sp = thingAt(...R.player, "spikes");
    if (sp && spikesUp(sp)) hurt();
    R.tick++;
    if (run.hearts > 0) { save(); render(); }
  }

  function pickUp(x, y) {
    const R = run.room, item = thingAt(x, y, "coin", "gem", "key", "potion");
    if (!item) return;
    R.things.splice(R.things.indexOf(item), 1);
    if (item.type === "coin") { run.coins += 1; log("Münze! +1"); }
    if (item.type === "gem") { run.coins += 5; log("Edelstein! +5"); }
    if (item.type === "key") { R.hasKey = true; log("Schlüssel! Die Tür oben ist offen."); }
    if (item.type === "potion") {
      if (run.hearts < MAX_HEARTS) { run.hearts++; log("Trank getrunken. +1 Herz"); }
      else { run.coins += 2; log("Trank verkauft, du bist ja fit. +2"); }
    }
  }

  function hurt() {
    run.hearts--;
    flash();
    if (run.hearts <= 0) return gameOver();
    log(run.hearts === 1 ? "Autsch! Nur noch ein Herz." : "Autsch, Stacheln! −1 Herz");
  }

  function nextRoom() {
    const left = run.room.things.filter(t => t.type === "coin" || t.type === "gem").length;
    const no = run.room.no + 1;
    if (no - 1 > best) { best = no - 1; try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {} }
    enterRoom(no);
    if (left) log(`${left} ${left === 1 ? "Schatz blieb" : "Schätze blieben"} zurück. ${run.room.no === 2 ? "Achtung, Stacheln!" : "Weiter geht's."}`);
  }

  function gameOver() {
    const reached = run.room.no;
    if (reached - 1 > best) { best = reached - 1; try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {} }
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    render();
    overlay("Game Over", `Raum ${reached} erreicht, ${run.coins} Münzen gesammelt. Bester Lauf: ${best} ${best === 1 ? "Raum" : "Räume"} geschafft.`, "Neues Spiel", () => newRun());
  }

  function overlay(title, text, btn, onClick, withLegend) {
    busy = true;
    $("ov-title").textContent = title;
    $("ov-text").textContent = text;
    $("ov-btn").textContent = btn;
    $("legend").hidden = !withLegend;
    $("overlay").hidden = false;
    $("ov-btn").onclick = () => { $("overlay").hidden = true; busy = false; onClick?.(); };
  }

  function log(text) { $("log").textContent = text; }

  let flashUntil = 0;
  function flash() { flashUntil = performance.now() + 180; requestAnimationFrame(render); setTimeout(render, 200); }

  // ---------- Zeichnen ----------
  function resize() {
    const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(r.width * dpr);
    cv.height = Math.round(r.height * dpr);
    render();
  }

  function drawHearts() {
    const box = $("hearts");
    box.innerHTML = "";
    for (let i = 0; i < MAX_HEARTS; i++) {
      const c = document.createElement("canvas");
      c.width = c.height = 18;
      sprite(c.getContext("2d"), i < run.hearts ? "heart" : "heartEmpty", 0, 0, 18, css("--pixel"));
      box.appendChild(c);
    }
    box.setAttribute("aria-label", `${run.hearts} von ${MAX_HEARTS} Herzen`);
  }

  function render() {
    if (!run) return;
    $("room").textContent = run.room.no;
    $("coins").textContent = run.coins;
    drawHearts();

    const R = run.room, s = cv.width / N;
    const c = { lcd: css("--lcd"), pixel: css("--pixel"), ghost: css("--ghost"), soft: css("--soft"), mortar: css("--mortar") };
    const hit = performance.now() < flashUntil;
    ctx.fillStyle = hit ? c.pixel : c.lcd;
    ctx.fillRect(0, 0, cv.width, cv.height);
    if (hit) return;

    for (let y = 0; y < N; y++)
      for (let x = 0; x < N; x++) {
        const px = Math.floor(x * s), py = Math.floor(y * s), w = Math.ceil(s);
        if (isWall(x, y) && !(x === DOOR[0] && y === DOOR[1])) {
          // Mauer mit Fugen
          ctx.fillStyle = c.pixel;
          ctx.fillRect(px, py, w, w);
          ctx.fillStyle = c.mortar;
          const off = y % 2 ? s / 2 : 0, line = Math.max(1, Math.round(s / 12));
          ctx.fillRect(px, Math.round(py + s / 2), w, line);
          ctx.fillRect(Math.round(px + (off || s * 0.25)), py, line, Math.round(s / 2));
          ctx.fillRect(Math.round(px + (off ? s * 0.25 : s * 0.75)), Math.round(py + s / 2), line, Math.round(s / 2));
        } else {
          ctx.fillStyle = c.ghost;
          const d = Math.max(1, Math.round(s / 14));
          ctx.fillRect(px, py, w, d);
          ctx.fillRect(px, py, d, w);
        }
      }

    // Tür
    sprite(ctx, R.hasKey ? "doorOpen" : "doorShut", DOOR[0] * s, DOOR[1] * s, s, c.pixel);

    for (const t of R.things) {
      const name = t.type === "spikes" ? (spikesUp(t) ? "spikesUp" : "spikesDown") : t.type;
      const faint = t.type === "spikes" && !spikesUp(t);
      sprite(ctx, name, t.x * s, t.y * s, s, faint ? c.soft : c.pixel);
    }

    // Spieler; auf Stacheln mit hellem Rand, damit er erkennbar bleibt
    const [px, py] = R.player;
    if (thingAt(px, py, "spikes")) { ctx.fillStyle = c.lcd; ctx.fillRect(px * s + s * 0.1, py * s + s * 0.1, s * 0.8, s * 0.8); }
    sprite(ctx, "player", px * s, py * s, s, c.pixel);
  }

  function buildLegend() {
    const items = [
      ["key", "Schlüssel: öffnet die Tür oben"],
      ["crate", "Kiste: lässt sich schieben"],
      ["pillar", "Säule: unbeweglich"],
      ["spikesUp", "Stacheln: wechseln jede Runde. Oben = −1 Herz"],
      ["coin", "Münze +1, Edelstein +5"],
      ["potion", "Trank: +1 Herz"],
    ];
    const box = $("legend");
    box.innerHTML = "";
    for (const [name, text] of items) {
      const c = document.createElement("canvas");
      c.width = c.height = 44;
      sprite(c.getContext("2d"), name, 0, 0, 44, css("--pixel"));
      const span = document.createElement("span");
      span.textContent = text;
      box.append(c, span);
    }
  }

  function showHelp(first) {
    overlay(first ? "Verlies" : "So geht's",
      "Hol den Schlüssel und geh durch die Tür oben. Jeder Schritt ist eine Runde, „Warten“ lässt eine verstreichen.",
      first ? "Los geht's" : "Weiter", null, true);
  }

  // ---------- Steuerung ----------
  document.querySelectorAll(".key[data-dir]").forEach(btn => {
    const [dx, dy] = btn.dataset.dir.split(",").map(Number);
    let repeat = null;
    const stop = () => { clearTimeout(repeat); clearInterval(repeat); repeat = null; btn.classList.remove("on"); };
    btn.addEventListener("pointerdown", e => {
      e.preventDefault();
      btn.setPointerCapture?.(e.pointerId);
      btn.classList.add("on");
      act(dx, dy);
      repeat = setTimeout(() => { repeat = setInterval(() => act(dx, dy), 140); }, 320);
    });
    ["pointerup", "pointercancel", "lostpointercapture"].forEach(ev => btn.addEventListener(ev, stop));
    btn.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(dx, dy); } });
  });
  function waitTurn() { if (busy) return; log("Du wartest eine Runde."); act(0, 0); }
  $("wait").addEventListener("click", waitTurn);

  let sx = null, sy = null;
  cv.addEventListener("pointerdown", e => { sx = e.clientX; sy = e.clientY; });
  cv.addEventListener("pointermove", e => {
    if (sx === null) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 26) return;
    Math.abs(dx) > Math.abs(dy) ? act(Math.sign(dx), 0) : act(0, Math.sign(dy));
    sx = e.clientX; sy = e.clientY;
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach(ev => cv.addEventListener(ev, () => { sx = sy = null; }));

  document.addEventListener("keydown", e => {
    const map = { ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1], ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0], " ": [0, 0], ".": [0, 0] };
    if (!map[e.key]) return;
    // Leertaste auf einem fokussierten Knopf löst den Knopf aus, nicht „Warten“
    if (e.key === " " && e.target.tagName === "BUTTON") return;
    e.preventDefault();
    if (e.key === " " || e.key === ".") waitTurn(); else act(...map[e.key]);
  });

  // Raum neu: zurück zum Zustand beim Betreten, falls eine Kiste den Weg blockiert
  let confirmTimer = null;
  $("retry").addEventListener("click", () => {
    if (busy) return;
    if (!confirmTimer) {
      $("retry").textContent = "Nochmal tippen";
      confirmTimer = setTimeout(() => { $("retry").textContent = "Raum neu"; confirmTimer = null; }, 2500);
      return;
    }
    clearTimeout(confirmTimer);
    confirmTimer = null;
    $("retry").textContent = "Raum neu";
    Object.assign(run, clone(run.snapshot));
    log("Der Raum ist wieder wie beim Betreten.");
    save();
    render();
  });
  $("help").addEventListener("click", () => { if (!busy) showHelp(false); });

  window.addEventListener("resize", resize);
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }

  buildLegend();
  run = load();
  const firstVisit = !run;
  if (run) log(`Weiter in Raum ${run.room.no}.`);
  else newRun();
  resize();
  if (firstVisit) showHelp(true);
})();
</script>
</body>
</html>
